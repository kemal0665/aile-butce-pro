name: APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: |
          cat > android/app/google-services.json << 'EOF'
          {"project_info":{"project_number":"1060268836577","project_id":"ailebutce-fbabc","storage_bucket":"ailebutce-fbabc.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:1060268836577:android:523309789975e7d69059a0","android_client_info":{"package_name":"com.ailebutce.pro"}},"api_key":[{"current_key":"AIzaSyAyJAfekNSERvK-86Xxlf7GgHBSFEvIfOg"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
      - run: mkdir -p android/app/src/main/java/com/ailebutce/pro && cp android-config/MainActivity.java android/app/src/main/java/com/ailebutce/pro/MainActivity.java
      - run: chmod +x android/gradlew
      - name: Keystore olustur ve imzala
        run: |
          keytool -genkeypair -v -keystore aile.keystore -alias aile -keyalg RSA -keysize 2048 -validity 10000 -storepass aile1234 -keypass aile1234 -dname "CN=Aile,O=Aile,C=TR"
          cd android && ./gradlew assembleRelease --no-daemon && cd ..
          BTVER=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BTVER/zipalign -v 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore aile.keystore -storepass aile1234 -keypass aile1234 aligned.apk aile
          cp aligned.apk aile-butce.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aile-butce-pro
          path: aile-butce.apk
          retention-days: 30
