<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <title>Ev Bütçesi Pro</title>
  <style>
    :root {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #dfe7e2;
      --teal: #0f766e;
      --teal-2: #14b8a6;
      --teal-soft: #e3f5f2;
      --green: #15803d;
      --red: #be123c;
      --amber: #d97706;
      --blue: #2563eb;
      --shadow: 0 18px 44px rgba(23, 32, 51, .10);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    h1, h2, h3, p { margin: 0; }

    .app {
      max-width: 560px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
      padding-bottom: 96px;
    }

    .hero {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px 16px 16px;
      color: #ffffff;
      background: linear-gradient(135deg, #0b3b37 0%, #0f766e 58%, #d97706 145%);
      box-shadow: 0 8px 28px rgba(15, 118, 110, .22);
    }

    .hero-top, .row-between, .section-head, .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .22);
      font-weight: 900;
    }

    .brand strong, .brand span { display: block; }
    .brand strong { font-size: 18px; }
    .brand span { margin-top: 2px; color: rgba(255, 255, 255, .74); font-size: 12px; }

    .icon-btn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: rgba(255, 255, 255, .15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, .22);
    }

    .icon-btn svg, .nav button svg, .primary svg, .mini svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .balance-card {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 18px;
      background: rgba(255, 255, 255, .12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
    }

    .label {
      display: block;
      color: rgba(255, 255, 255, .72);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .balance {
      display: block;
      margin-top: 6px;
      font-size: 42px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0;
    }

    .balance-note {
      margin-top: 10px;
      color: rgba(255, 255, 255, .78);
      font-size: 13px;
      line-height: 1.4;
    }

    .period {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      height: 42px;
      margin-top: 14px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(2, 23, 23, .28);
    }

    .period button {
      border-radius: 10px;
      color: rgba(255, 255, 255, .72);
      background: transparent;
      font-weight: 850;
      font-size: 13px;
    }

    .period button.active {
      color: #0b3b37;
      background: #ffffff;
    }

    main { padding: 16px; }
    .grid { display: grid; gap: 12px; }
    .stats { grid-template-columns: repeat(3, 1fr); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .stat {
      min-width: 0;
      padding: 14px 12px;
    }

    .stat small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .stat b {
      display: block;
      margin-top: 7px;
      font-size: 17px;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .section {
      margin-top: 16px;
      padding: 16px;
    }

    .section h2 {
      font-size: 17px;
      letter-spacing: 0;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .chart-layout {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 14px;
      align-items: center;
      margin-top: 16px;
    }

    .donut-wrap {
      position: relative;
      width: 150px;
      height: 150px;
    }

    canvas { display: block; max-width: 100%; }

    .donut-center {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
    }

    .donut-center b { font-size: 18px; }
    .donut-center small { display: block; color: var(--muted); font-size: 11px; }

    .legend {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .legend-row span {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .legend-row small {
      color: var(--muted);
      font-weight: 800;
    }

    .quick-form {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .segmented {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f7faf8;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented label {
      display: grid;
      place-items: center;
      min-height: 38px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .segmented input:checked + label {
      color: #ffffff;
      background: var(--teal);
    }

    label.input-label {
      display: grid;
      gap: 7px;
      color: #344054;
      font-size: 12px;
      font-weight: 850;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 0 13px;
      background: #fbfdfc;
      color: var(--ink);
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-soft);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      min-height: 50px;
      border-radius: 14px;
      background: var(--teal);
      color: #ffffff;
      font-weight: 950;
      box-shadow: 0 12px 24px rgba(15, 118, 110, .22);
    }

    .primary:active { transform: translateY(1px); }

    .mini {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      border-radius: 11px;
      padding: 0 11px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 12px;
      font-weight: 950;
    }

    .transaction-list, .budget-list, .insight-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .transaction {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #ffffff;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 13px;
      color: #ffffff;
      font-weight: 950;
      background: var(--teal);
    }

    .transaction strong {
      display: block;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px;
    }

    .transaction small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .amount {
      text-align: right;
      font-size: 15px;
      font-weight: 950;
      white-space: nowrap;
    }

    .income { color: var(--green); }
    .expense { color: var(--red); }
    .saving { color: var(--blue); }

    .budget-row {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #ffffff;
    }

    .progress {
      height: 9px;
      overflow: hidden;
      border-radius: 99px;
      background: #edf2ef;
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--teal);
    }

    .insight {
      padding: 12px;
      border-radius: 15px;
      background: #f7faf8;
      border: 1px solid var(--line);
      color: #344054;
      font-size: 13px;
      line-height: 1.45;
    }

    .empty {
      padding: 18px;
      border-radius: 15px;
      background: #f7faf8;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .nav {
      position: fixed;
      left: 50%;
      bottom: 12px;
      z-index: 30;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      width: min(536px, calc(100% - 20px));
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 18px 38px rgba(23, 32, 51, .18);
      backdrop-filter: blur(16px);
    }

    .nav button {
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 54px;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
    }

    .nav button.active {
      color: var(--teal);
      background: var(--teal-soft);
    }

    .fab {
      position: fixed;
      left: 50%;
      bottom: 84px;
      z-index: 31;
      transform: translateX(-50%);
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 20px;
      background: var(--teal);
      color: #ffffff;
      box-shadow: 0 18px 34px rgba(15, 118, 110, .32);
    }

    .fab svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
    }

    .page { display: none; }
    .page.active { display: block; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(9, 20, 30, .58);
    }

    .modal.open { display: flex; }

    .modal-box {
      width: min(560px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 18px;
      border-radius: 24px 24px 0 0;
      background: #ffffff;
    }

    .modal-head { margin-bottom: 14px; }
    .modal-head h2 { font-size: 20px; }

    .close {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #f1f5f3;
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 100;
      transform: translateX(-50%);
      width: min(520px, calc(100% - 28px));
      padding: 13px 16px;
      border-radius: 15px;
      background: #101820;
      color: #ffffff;
      text-align: center;
      font-weight: 900;
      box-shadow: 0 18px 36px rgba(0, 0, 0, .25);
    }

    @media (max-width: 430px) {
      .balance { font-size: 36px; }
      .stats { gap: 9px; }
      .stat { padding: 12px 10px; }
      .stat b { font-size: 15px; }
      .chart-layout { grid-template-columns: 1fr; justify-items: center; }
      .legend { width: 100%; }
      .two-col { grid-template-columns: 1fr; }
      .transaction { grid-template-columns: 42px minmax(0, 1fr); }
      .amount { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top">
        <div class="brand">
          <div class="brand-mark">EB</div>
          <div>
            <strong>Ev Bütçesi Pro</strong>
            <span id="monthTitle">Bu ay</span>
          </div>
        </div>
        <button class="icon-btn" id="resetBtn" title="Örnek verileri yükle" aria-label="Örnek verileri yükle">
          <svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M20 20v-6h-6"/><path d="M5.6 14.5A7 7 0 0 0 17.7 18"/><path d="M18.4 9.5A7 7 0 0 0 6.3 6"/></svg>
        </button>
      </div>

      <div class="balance-card">
        <span class="label">Kalan bütçe</span>
        <strong class="balance" id="netBalance">0 TL</strong>
        <p class="balance-note" id="balanceNote">Gelir ve giderleriniz hesaplanıyor.</p>
      </div>

      <div class="period" role="group" aria-label="Dönem filtresi">
        <button class="active" data-period="month">Ay</button>
        <button data-period="week">Hafta</button>
        <button data-period="year">Yıl</button>
      </div>
    </header>

    <main>
      <section id="page-home" class="page active">
        <div class="grid stats">
          <article class="card stat"><small>Gelir</small><b id="incomeTotal">0 TL</b></article>
          <article class="card stat"><small>Gider</small><b id="expenseTotal">0 TL</b></article>
          <article class="card stat"><small>Tasarruf</small><b id="savingRate">%0</b></article>
        </div>

        <section class="card section">
          <div class="section-head">
            <h2>Gider dağılımı</h2>
            <span id="largestCategory">Kategori yok</span>
          </div>
          <div class="chart-layout">
            <div class="donut-wrap">
              <canvas id="donut" width="150" height="150"></canvas>
              <div class="donut-center"><div><b id="donutTotal">0 TL</b><small>toplam gider</small></div></div>
            </div>
            <div class="legend" id="legend"></div>
          </div>
        </section>

        <section class="card section">
          <div class="section-head">
            <h2>Hızlı işlem</h2>
            <span>30 saniye</span>
          </div>
          <form class="quick-form" id="quickForm">
            <div class="segmented">
              <input type="radio" id="typeExpense" name="type" value="expense" checked>
              <label for="typeExpense">Gider</label>
              <input type="radio" id="typeIncome" name="type" value="income">
              <label for="typeIncome">Gelir</label>
              <input type="radio" id="typeSaving" name="type" value="saving">
              <label for="typeSaving">Birikim</label>
            </div>
            <div class="two-col">
              <label class="input-label">Tutar
                <input id="amount" name="amount" type="number" min="1" step="1" placeholder="1250" required>
              </label>
              <label class="input-label">Kategori
                <select id="category" name="category"></select>
              </label>
            </div>
            <label class="input-label">Not
              <input id="note" name="note" type="text" maxlength="48" placeholder="Market alışverişi">
            </label>
            <button class="primary" type="submit">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              İşlem ekle
            </button>
          </form>
        </section>

        <section class="card section">
          <div class="section-head">
            <h2>Akıllı özet</h2>
            <span id="healthScore">Durum</span>
          </div>
          <div class="insight-list" id="insights"></div>
        </section>
      </section>

      <section id="page-transactions" class="page">
        <section class="card section">
          <div class="section-head">
            <h2>İşlemler</h2>
            <button class="mini" id="clearBtn" type="button">
              <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
              Temizle
            </button>
          </div>
          <div class="transaction-list" id="transactionList"></div>
        </section>
      </section>

      <section id="page-budgets" class="page">
        <section class="card section">
          <div class="section-head">
            <h2>Bütçe hedefleri</h2>
            <span>Limit takibi</span>
          </div>
          <div class="budget-list" id="budgetList"></div>
        </section>
      </section>

      <section id="page-settings" class="page">
        <section class="card section">
          <div class="section-head">
            <h2>Ayarlar</h2>
            <span>Yerel kayıt</span>
          </div>
          <form class="quick-form" id="settingsForm">
            <label class="input-label">Aylık gider hedefi
              <input id="monthlyLimit" type="number" min="1" step="1">
            </label>
            <label class="input-label">Birikim hedefi
              <input id="savingGoal" type="number" min="1" step="1">
            </label>
            <button class="primary" type="submit">Ayarları kaydet</button>
          </form>
        </section>
      </section>
    </main>

    <button class="fab" id="openAdd" aria-label="Yeni işlem">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="nav" aria-label="Alt gezinme">
      <button class="active" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>
        Panel
      </button>
      <button data-page="transactions">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
        İşlemler
      </button>
      <button data-page="budgets">
        <svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16v-5"/><path d="M13 16V8"/><path d="M18 16v-3"/></svg>
        Bütçe
      </button>
      <button data-page="settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 1.98l.05.05a2 2 0 1 1-2.83 2.83l-.05-.05A1.8 1.8 0 0 0 15 19.4a1.8 1.8 0 0 0-1 .6 1.8 1.8 0 0 0-.5 1.28V21a2 2 0 1 1-4 0v-.07A1.8 1.8 0 0 0 8.5 19.4a1.8 1.8 0 0 0-1.98.36l-.05.05a2 2 0 1 1-2.83-2.83l.05-.05A1.8 1.8 0 0 0 4.6 15a1.8 1.8 0 0 0-.6-1 1.8 1.8 0 0 0-1.28-.5H2.6a2 2 0 1 1 0-4h.07A1.8 1.8 0 0 0 4.6 8.5a1.8 1.8 0 0 0-.36-1.98l-.05-.05A2 2 0 1 1 7.02 3.64l.05.05A1.8 1.8 0 0 0 9 4.6a1.8 1.8 0 0 0 1-.6 1.8 1.8 0 0 0 .5-1.28V2.6a2 2 0 1 1 4 0v.07A1.8 1.8 0 0 0 15.5 4.6a1.8 1.8 0 0 0 1.98-.36l.05-.05a2 2 0 1 1 2.83 2.83l-.05.05A1.8 1.8 0 0 0 19.4 9c.35.2.6.55.6 1v.5"/></svg>
        Ayarlar
      </button>
    </nav>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Yeni işlem</h2>
        <button class="close" id="closeAdd" aria-label="Kapat">×</button>
      </div>
      <form class="quick-form" id="modalForm"></form>
    </div>
  </div>

  <script>
    const storeKey = "evButcesiProDataV2";
    const colors = ["#0f766e", "#d97706", "#2563eb", "#be123c", "#7c3aed", "#15803d", "#475569", "#0891b2"];
    const categories = {
      expense: ["Market", "Kira", "Faturalar", "Ulaşım", "Sağlık", "Eğlence", "Eğitim", "Diğer"],
      income: ["Maaş", "Ek gelir", "Kira geliri", "Satış", "Diğer"],
      saving: ["Altın", "Döviz", "Banka", "Acil durum", "Diğer"]
    };
    const budgets = [
      { category: "Market", limit: 7500 },
      { category: "Faturalar", limit: 3500 },
      { category: "Ulaşım", limit: 3000 },
      { category: "Eğlence", limit: 2200 }
    ];
    const formatter = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 0 });
    const dateFormatter = new Intl.DateTimeFormat("tr-TR", { day: "2-digit", month: "short" });
    const monthFormatter = new Intl.DateTimeFormat("tr-TR", { month: "long", year: "numeric" });
    const today = new Date();

    let period = "month";
    let state = loadState();

    const els = {
      category: document.getElementById("category"),
      quickForm: document.getElementById("quickForm"),
      modalForm: document.getElementById("modalForm"),
      modal: document.getElementById("addModal"),
      donut: document.getElementById("donut"),
      navButtons: [...document.querySelectorAll(".nav button")],
      periodButtons: [...document.querySelectorAll(".period button")]
    };

    function demoState() {
      return {
        settings: { monthlyLimit: 28000, savingGoal: 120000 },
        transactions: [
          { id: uid(), type: "income", amount: 46000, category: "Maaş", note: "Aylık maaş", date: isoOffset(-16) },
          { id: uid(), type: "expense", amount: 14500, category: "Kira", note: "Mayıs kirası", date: isoOffset(-14) },
          { id: uid(), type: "expense", amount: 4200, category: "Market", note: "Aylık temel alışveriş", date: isoOffset(-9) },
          { id: uid(), type: "expense", amount: 1850, category: "Faturalar", note: "Elektrik ve internet", date: isoOffset(-7) },
          { id: uid(), type: "income", amount: 6500, category: "Ek gelir", note: "Ek ödeme", date: isoOffset(-5) },
          { id: uid(), type: "expense", amount: 1250, category: "Ulaşım", note: "Yakıt", date: isoOffset(-2) },
          { id: uid(), type: "saving", amount: 3000, category: "Banka", note: "Aylık birikim", date: isoOffset(-1) }
        ]
      };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storeKey) || "null");
        if (saved && Array.isArray(saved.transactions)) return saved;
      } catch (error) {}
      return demoState();
    }

    function persist() {
      localStorage.setItem(storeKey, JSON.stringify(state));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function isoOffset(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function money(value) {
      return formatter.format(Number(value || 0)) + " TL";
    }

    function inPeriod(item) {
      const date = new Date((item.date || isoOffset(0)) + "T00:00:00");
      if (period === "year") return date.getFullYear() === today.getFullYear();
      if (period === "week") {
        const diff = (today - date) / 86400000;
        return diff >= 0 && diff <= 7;
      }
      return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth();
    }

    function filtered() {
      return state.transactions.filter(inPeriod);
    }

    function totals() {
      return filtered().reduce((acc, item) => {
        acc[item.type] = (acc[item.type] || 0) + Number(item.amount || 0);
        return acc;
      }, { income: 0, expense: 0, saving: 0 });
    }

    function groupExpenses() {
      return filtered()
        .filter(item => item.type === "expense")
        .reduce((acc, item) => {
          acc[item.category] = (acc[item.category] || 0) + Number(item.amount || 0);
          return acc;
        }, {});
    }

    function buildForm(form) {
      form.innerHTML = document.getElementById("quickForm").innerHTML;
      form.addEventListener("change", event => {
        if (event.target.name === "type") fillCategories(form);
      });
      form.addEventListener("submit", addTransaction);
      fillCategories(form);
    }

    function fillCategories(scope) {
      const type = new FormData(scope).get("type") || "expense";
      const select = scope.querySelector("[name='category']");
      select.innerHTML = categories[type].map(cat => `<option>${cat}</option>`).join("");
    }

    function addTransaction(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);
      const amount = Number(data.get("amount"));
      if (!Number.isFinite(amount) || amount <= 0) return;

      const record = {
        id: uid(),
        type: data.get("type"),
        amount,
        category: data.get("category"),
        note: (data.get("note") || data.get("category") || "İşlem").toString().trim(),
        date: isoOffset(0)
      };

      state.transactions.unshift({
        ...record
      });

      persist();
      form.reset();
      form.querySelector("[value='expense']").checked = true;
      fillCategories(form);
      closeModal();
      toast("İşlem kaydedildi");
      notifyTransactionAdded(record);
      render();
    }

    async function notifyTransactionAdded(record) {
      const plugins = window.Capacitor && window.Capacitor.Plugins;
      const notifications = plugins && plugins.LocalNotifications;
      if (!notifications) return;

      try {
        const permission = await notifications.requestPermissions();
        if (permission.display !== "granted") return;

        const title = record.type === "income"
          ? "Gelir eklendi"
          : record.type === "saving"
            ? "Birikim eklendi"
            : "Gider eklendi";

        await notifications.schedule({
          notifications: [{
            id: Math.floor(Date.now() % 2147483647),
            title,
            body: `${record.category}: ${money(record.amount)} kaydedildi.`,
            schedule: { at: new Date(Date.now() + 700) },
            iconColor: "#0f766e"
          }]
        });
      } catch (error) {
        console.warn("Bildirim gönderilemedi", error);
      }
    }

    function render() {
      const t = totals();
      const net = t.income - t.expense - t.saving;
      const rate = t.income > 0 ? Math.max(0, Math.round(((t.income - t.expense - t.saving) / t.income) * 100)) : 0;
      const usedLimit = state.settings.monthlyLimit > 0 ? Math.round((t.expense / state.settings.monthlyLimit) * 100) : 0;

      document.getElementById("monthTitle").textContent = monthFormatter.format(today);
      document.getElementById("netBalance").textContent = money(net);
      document.getElementById("incomeTotal").textContent = money(t.income);
      document.getElementById("expenseTotal").textContent = money(t.expense);
      document.getElementById("savingRate").textContent = "%" + rate;
      document.getElementById("donutTotal").textContent = money(t.expense);
      document.getElementById("balanceNote").textContent =
        net >= 0 ? `Aylık gider hedefinin %${usedLimit} kadarı kullanıldı.` : "Bu dönem giderler ve birikim gelirden yüksek.";

      renderChart();
      renderTransactions();
      renderBudgets();
      renderInsights(t, net, rate);
      document.getElementById("monthlyLimit").value = state.settings.monthlyLimit;
      document.getElementById("savingGoal").value = state.settings.savingGoal;
    }

    function renderChart() {
      const entries = Object.entries(groupExpenses()).sort((a, b) => b[1] - a[1]);
      const total = entries.reduce((sum, item) => sum + item[1], 0);
      const ctx = els.donut.getContext("2d");
      ctx.clearRect(0, 0, 150, 150);

      if (!entries.length) {
        ctx.beginPath();
        ctx.arc(75, 75, 54, 0, Math.PI * 2);
        ctx.strokeStyle = "#dfe7e2";
        ctx.lineWidth = 22;
        ctx.stroke();
        document.getElementById("legend").innerHTML = `<div class="empty">Gider ekleyince grafik oluşur.</div>`;
        document.getElementById("largestCategory").textContent = "Kategori yok";
        return;
      }

      let start = -Math.PI / 2;
      entries.forEach(([category, value], index) => {
        const angle = (value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(75, 75, 54, start, start + angle);
        ctx.strokeStyle = colors[index % colors.length];
        ctx.lineWidth = 22;
        ctx.lineCap = "round";
        ctx.stroke();
        start += angle;
      });

      document.getElementById("largestCategory").textContent = entries[0][0] + " önde";
      document.getElementById("legend").innerHTML = entries.slice(0, 5).map(([category, value], index) => `
        <div class="legend-row">
          <i class="dot" style="background:${colors[index % colors.length]}"></i>
          <span>${escapeHtml(category)}</span>
          <small>${money(value)}</small>
        </div>
      `).join("");
    }

    function renderTransactions() {
      const list = document.getElementById("transactionList");
      const items = filtered().sort((a, b) => new Date(b.date) - new Date(a.date));
      if (!items.length) {
        list.innerHTML = `<div class="empty">Bu dönem için işlem yok.</div>`;
        return;
      }

      list.innerHTML = items.map(item => {
        const sign = item.type === "income" ? "+" : "-";
        const cls = item.type;
        return `
          <article class="transaction">
            <div class="avatar" style="background:${typeColor(item.type)}">${escapeHtml(item.category.slice(0, 1))}</div>
            <div>
              <strong>${escapeHtml(item.note)}</strong>
              <small>${escapeHtml(item.category)} · ${dateFormatter.format(new Date(item.date + "T00:00:00"))}</small>
            </div>
            <div class="amount ${cls}">${sign}${money(item.amount)}</div>
          </article>
        `;
      }).join("");
    }

    function renderBudgets() {
      const groups = groupExpenses();
      document.getElementById("budgetList").innerHTML = budgets.map(item => {
        const spent = groups[item.category] || 0;
        const percent = item.limit > 0 ? Math.min(100, Math.round((spent / item.limit) * 100)) : 0;
        const tone = percent >= 90 ? "var(--red)" : percent >= 70 ? "var(--amber)" : "var(--teal)";
        return `
          <article class="budget-row">
            <div class="row-between">
              <strong>${item.category}</strong>
              <span style="color:${tone};font-weight:950">%${percent}</span>
            </div>
            <small style="color:var(--muted);font-weight:800">${money(spent)} / ${money(item.limit)}</small>
            <div class="progress"><span style="width:${percent}%;background:${tone}"></span></div>
          </article>
        `;
      }).join("");
    }

    function renderInsights(t, net, rate) {
      const limit = state.settings.monthlyLimit || 0;
      const remain = Math.max(0, limit - t.expense);
      const savingProgress = state.settings.savingGoal ? Math.round((t.saving / state.settings.savingGoal) * 100) : 0;
      document.getElementById("healthScore").textContent = net >= 0 ? "Dengeli" : "Riskli";
      document.getElementById("insights").innerHTML = [
        `Bu dönem giderlerden sonra kullanılabilir bakiye ${money(net)}.`,
        `Aylık gider hedefinden kalan alan ${money(remain)}.`,
        `Tasarruf oranı %${rate}; birikim hedefinin bu dönem %${Math.max(0, savingProgress)} kadarı tamamlandı.`
      ].map(text => `<div class="insight">${text}</div>`).join("");
    }

    function typeColor(type) {
      if (type === "income") return "var(--green)";
      if (type === "saving") return "var(--blue)";
      return "var(--teal)";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function toast(message) {
      const old = document.querySelector(".toast");
      if (old) old.remove();
      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    function openModal() {
      els.modal.classList.add("open");
      buildForm(els.modalForm);
    }

    function closeModal() {
      els.modal.classList.remove("open");
    }

    els.quickForm.addEventListener("change", event => {
      if (event.target.name === "type") fillCategories(els.quickForm);
    });
    els.quickForm.addEventListener("submit", addTransaction);

    document.getElementById("settingsForm").addEventListener("submit", event => {
      event.preventDefault();
      state.settings.monthlyLimit = Number(document.getElementById("monthlyLimit").value) || 28000;
      state.settings.savingGoal = Number(document.getElementById("savingGoal").value) || 120000;
      persist();
      toast("Ayarlar kaydedildi");
      render();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("Tüm işlemler silinsin mi?")) return;
      state.transactions = [];
      persist();
      render();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state = demoState();
      persist();
      toast("Örnek veriler yüklendi");
      render();
    });

    document.getElementById("openAdd").addEventListener("click", openModal);
    document.getElementById("closeAdd").addEventListener("click", closeModal);
    els.modal.addEventListener("click", event => {
      if (event.target === els.modal) closeModal();
    });

    els.navButtons.forEach(button => {
      button.addEventListener("click", () => {
        const page = button.dataset.page;
        document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
        document.getElementById("page-" + page).classList.add("active");
        els.navButtons.forEach(el => el.classList.toggle("active", el === button));
      });
    });

    els.periodButtons.forEach(button => {
      button.addEventListener("click", () => {
        period = button.dataset.period;
        els.periodButtons.forEach(el => el.classList.toggle("active", el === button));
        render();
      });
    });

    fillCategories(els.quickForm);
    render();
  </script>
</body>
</html>
